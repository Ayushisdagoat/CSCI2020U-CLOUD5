<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CLOUD5 Game Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
</head>
<body>


<div id="login-screen" class="screen">
    <div class="login-logo">CLOUD5</div>
    <div class="login-box">
        <h2>Login</h2>
        <div><label>Username</label><input id="inp-user" type="text" autocomplete="off"/></div>
        <div><label>Password</label><input id="inp-pass" type="password"/></div>
        <div id="login-error">Invalid Username or Password</div>
        <button class="btn btn-primary" onclick="doLogin()">Login</button>
    </div>
</div>

<div id="catalog-screen" class="screen active">
    <div class="header">
        <div class="header-logo">CLOUD5</div>
        <div class="search-wrap">
            <input type="text" id="search-bar" placeholder="Search games…" oninput="filterCatalog()"/>
            <select id="genre-filter" onchange="filterCatalog()">
                <option value="">All Genres</option>
            </select>
        </div>
        <div class="header-right" id="header-right"></div>
    </div>
    <div class="catalog-body" id="catalog-body">
        <div class="search-results" id="search-results"></div>
    </div>
</div>

<div id="game-screen" class="screen">
    <div class="game-title-bar" id="game-title-bar"></div>
    <div class="game-body">
        <div class="game-left" id="game-left">Loading…</div>
        <div class="game-right" id="game-right"></div>
    </div>
    <div class="game-footer" id="game-footer"></div>
</div>

<div id="cart-screen" class="screen">
    <div class="cart-header">
        <div class="header-logo">CLOUD5</div>
        <span style="color:var(--muted);font-size:0.9rem;">My Cart</span>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-footer" style="flex-direction:column;gap:12px;align-items:stretch;">
        <div id="cart-total-row" class="cart-total-row" style="display:none;">
            <span class="cart-total-label">Estimated Total</span>
            <span class="cart-total-value" id="cart-total-value">$0.00</span>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn btn-ghost" onclick="openCatalog()">← Continue Shopping</button>
            <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
            <button class="btn btn-buy" id="cart-buy-btn" style="display:none;" onclick="showToast('Purchased!')">Buy Now</button>
        </div>
    </div>
</div>

<div id="profile-screen" class="screen">
    <div class="profile-header">
        <div class="header-logo">CLOUD5</div>
        <span style="color:var(--muted);font-size:0.9rem;">Profile</span>
    </div>
    <div class="profile-body" id="profile-body"></div>
    <div class="profile-footer">
        <button class="btn btn-ghost" onclick="openCatalog()">← Back to Store</button>
    </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<div id="support-widget">
    <div id="support-popup" class="support-hidden">
        <div class="support-header">Contact Support</div>
        <div class="support-row"> <a href="tel:6470000000">647-000-0000</a></div>
        <div class="support-row"> <a href="mailto:support@cloud5.com">support@cloud5.com</a></div>
    </div>
    <button id="support-btn" onclick="toggleSupportPopup(event)" title="Support">?</button>
</div>

<script>

    const style = document.createElement('style');
    style.textContent = `
      :root {
        --bg: #191919;
        --bg2: #121212;
        --bg3: #232323;
        --card: #232323;
        --border: #2e2e2e;
        --text: #f0f0f0;
        --muted: #999;
        --accent: #4682B4;
        --accent2: #ff7878;
        --inp: #3c3c3c;
      }
      * {
        box-sizing:border-box;
        margin:0;
        padding:0;
      }
      body {
        background:var(--bg);
        color:var(--text);
        font-family:'Inter',sans-serif;
        height:100vh;
        overflow:hidden;
      }
      .screen {
        display:none;
      }
      .screen.active {
        display:flex;
        flex-direction:column;
        height:100vh;
        overflow:hidden;
      }
      #login-screen {
        align-items:center;
        justify-content:center;
      }
      .login-logo {
        font-family:'Arial',sans-serif;
        font-size:3.5rem;
        font-weight:700;
        letter-spacing:4px;
        color:#fff;
        margin-bottom:2rem;
        text-align:center;
      }
      .login-box {
        background:var(--bg3);
        border:1px solid var(--border);
        border-radius:8px;
        padding:2rem;
        width:340px;
        display:flex;
        flex-direction:column;
        gap:1rem;
      }
      .login-box h2 {
        text-align:center;
        font-size:1.3rem;
        font-weight:500;
      }
      .login-box label {
        font-size:0.8rem;
        color:var(--muted);
        margin-bottom:2px;
        display:block;
      }
      .login-box input {
        width:100%;
        background:var(--inp);
        border:1px solid var(--border);
        border-radius:4px;
        padding:8px 10px;
        color:var(--text);
        font-size:0.95rem;
        outline:none;
      }
      .login-box input:focus {
        border-color:var(--accent);
      }
      #login-error {
        color:var(--accent2);
        font-size:0.82rem;
        text-align:center;
        display:none;
      }
      .btn {
        border:none;
        border-radius:4px;
        padding:8px 16px;
        cursor:pointer;
        font-family:'Inter',sans-serif;
        font-size:0.88rem;
        font-weight:500;
        transition:opacity .15s;
      }
      .btn:hover {
        opacity:.85;
      }
      .btn:disabled {
        opacity:.45;
        cursor:default;
      }
      .btn-primary {
        background:var(--accent);
        color:#fff;
      }
      .btn-danger  {
        background:#c0392b;
        color:#fff;
      }
      .btn-ghost   {
        background:var(--bg3);
        color:var(--text);
        border:1px solid var(--border);
      }
      .btn-buy     {
        background:linear-gradient(135deg,#27ae60,#2ecc71);
        color:#fff;
        font-size:1rem;
        padding:12px 32px;
        border-radius:6px;
        font-weight:700;
        letter-spacing:0.5px;
      }
      .btn-buy:hover {
        opacity:.9;
      }

      .header {
        background:var(--bg2);
        padding:10px 20px;
        display:flex;
        align-items:center;
        gap:12px;
        border-bottom:1px solid var(--border);
        flex-shrink:0;
      }
      .header-logo {
        font-family:'Rajdhani',sans-serif;
        font-size:1.6rem;
        font-weight:700;
        letter-spacing:2px;
        color:#fff;
        white-space:nowrap;
      }
      .search-wrap {
        flex:1;
        max-width:620px;
        display:flex;
        gap:8px;
      }
      .search-wrap input[type=text] {
        flex:1;
        background:var(--inp);
        border:1px solid var(--border);
        border-radius:4px;
        padding:8px 12px;
        color:var(--text);
        font-size:1rem;
        outline:none;
        min-width:0;
      }
      .search-wrap input[type=text]:focus {
        border-color:var(--accent);
      }
      #genre-filter {
        background:var(--inp);
        border:1px solid var(--border);
        border-radius:4px;
        padding:8px 10px;
        color:var(--text);
        font-size:0.88rem;
        outline:none;
        cursor:pointer;
        flex-shrink:0;
      }
      #genre-filter:focus {
        border-color:var(--accent);
      }
      .header-right {
        display:flex;
        gap:8px;
        margin-left:auto;
      }

      #catalog-screen {
        background:var(--bg);
      }
      .catalog-body {
        flex:1;
        overflow-y:auto;
        padding:24px 28px;
        display:flex;
        flex-direction:column;
        gap:36px;
      }
      .genre-section {
        display:block;
       }
      .genre-heading {
        font-family:'Rajdhani',sans-serif;
        font-size:1.3rem;
        font-weight:700;
        letter-spacing:1px;
        color:var(--text);
        margin-bottom:14px;
        padding-bottom:6px;
        border-bottom:2px solid var(--accent);
        display:inline-block;
      }
      .genre-row {
        display:flex;
        gap:16px;
        overflow-x:auto;
        padding-bottom:8px;
      }
      .genre-row::-webkit-scrollbar {
        height:4px;
      }
      .genre-row::-webkit-scrollbar-track {
        background:var(--bg2);
      }
      .genre-row::-webkit-scrollbar-thumb {
        background:var(--border);
        border-radius:2px;
      }

      .game-card {
        background:var(--card);
        border:1px solid var(--border);
        border-radius:6px;
        overflow:hidden;
        cursor:pointer;
        transition:transform .15s,border-color .15s;
        flex-shrink:0;
        width:240px;
      }
      .game-card:hover {
        transform:translateY(-3px);
        border-color:var(--accent);
      }
      .game-card img {
        width:100%;
        display:block;
        height:112px;
        object-fit:cover;
      }
      .card-info {
        padding:9px 11px 11px;
      }
      .card-title-row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:4px;
        gap:6px;
      }
      .card-title {
        font-weight:600;
        font-size:0.88rem;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .platform-tag {
        background:var(--bg);
        color:var(--muted);
        font-size:0.66rem;
        padding:2px 6px;
        border-radius:3px;
        border:1px solid var(--border);
        flex-shrink:0;
      }
      .card-tags {
        color:var(--accent2);
        font-size:0.72rem;
        margin-bottom:5px;
      }
      .card-desc {
        color:var(--muted);
        font-size:0.75rem;
        line-height:1.4;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }

      .card-rating {
        display:flex;
        align-items:center;
        gap:5px;
        margin-top:5px;
      }
      .card-stars {
        font-size:0.78rem;
        letter-spacing:1px;
        color:#f1c40f;
      }
      .card-stars .dim {
        color:#333;
      }
      .card-rating-label {
        font-size:0.7rem;
        color:var(--muted);
      }

      .dummy-img {
        width:100%;
        height:112px;
        background:linear-gradient(135deg,#1a2535,#243040);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:12px;
      }
      .dummy-img span {
        color:var(--text);
        font-size:0.9rem;
        text-align:center;
        font-weight:600;
        line-height:1.3;
      }

       .search-results {
        display:none;
        grid-template-columns:repeat(4,1fr);
        gap:16px;
      }
      .search-results.active {
        display:grid;
      }
      .search-results .game-card {
        width:auto;
      }
      .search-results .game-card img {
        height:130px;
      }
      @media(max-width:1100px) {
        .search-results {
          grid-template-columns:repeat(3,1fr);
        }
      }

      .card-placeholder {
        background:var(--card);
        border:1px solid var(--border);
        border-radius:6px;
        overflow:hidden;
        animation:pulse 1.4s infinite;
        flex-shrink:0;
        width:240px;
      }
      .card-placeholder .ph-img {
        width:100%;
        height:112px;
        background:#2a2a2a;
      }
      .card-placeholder .ph-info {
        padding:9px 11px 13px;
        display:flex;
        flex-direction:column;
        gap:7px;
      }
      .card-placeholder .ph-line {
        height:11px;
        border-radius:3px;
        background:#2e2e2e;
      }
      .ph-short {
        width:55%;
      }
      @keyframes pulse {
        0%,100% { opacity:1; }
        50% { opacity:.5; }
      }

      #game-screen {
        background:var(--bg);
      }
      .game-title-bar {
        padding:20px 30px 0;
        font-family:'Rajdhani',sans-serif;
        font-size:2rem;
        font-weight:700;
      }
      .game-body {
        display:flex;
        gap:24px;
        padding:20px 30px;
        flex:1;
        overflow:hidden;
        min-height:0;
      }
      .game-left {
        flex:1;
        background:#000;
        border:1px solid var(--border);
        border-radius:6px;
        display:flex;
        flex-direction:column;
        color:var(--muted);
        overflow:hidden;
        min-height:0;
      }
      .game-left video {
        width:100%;
        display:block;
      }
      .game-right {
        width:380px;
        flex-shrink:0;
        background:var(--bg3);
        border:1px solid var(--border);
        border-radius:6px;
        padding:14px;
        display:flex;
        flex-direction:column;
        gap:10px;
        overflow-y:auto;
      }
      .game-right img {
        width:100%;
        border-radius:4px;
      }
      .game-right-desc {
        color:var(--muted);
        font-size:0.85rem;
        line-height:1.5;
      }
      .game-right-tags {
        color:var(--accent2);
        font-size:0.82rem;
        font-weight:600;
      }
      .game-footer {
        background:var(--bg2);
        border-top:1px solid var(--border);
        padding:12px 20px;
        display:flex;
        justify-content:center;
        gap:10px;
        flex-shrink:0;
      }
      .game-price-box {
        display:flex;
        align-items:center;
        justify-content:space-between;
        background:var(--bg);
        border:1px solid var(--border);
        border-radius:6px;
        padding:10px 14px;
        margin-top:4px;
      }
      .game-price-label {
        font-size:0.72rem;
        color:var(--muted);
        text-transform:uppercase;
        letter-spacing:0.5px;
      }
      .game-price-value {
        font-family:'Rajdhani',sans-serif;
        font-size:1.5rem;
        font-weight:700;
        color:#fff;
      }
      .dummy-game-hero {
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        background:linear-gradient(135deg,#1a2535,#243040);
        color:var(--muted);
        font-size:1.1rem;
      }

      .modal-overlay {
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.65);
        display:flex;
        align-items:center;
        justify-content:center;
        z-index:1000;
      }
      .modal-overlay.hidden {
        display:none;
      }
      .modal {
        background:var(--bg3);
        border:1px solid var(--border);
        border-radius:8px;
        padding:24px;
        min-width:320px;
        max-width:480px;
        width:90%;
        display:flex;
        flex-direction:column;
        gap:14px;
        max-height:90vh;
        overflow-y:auto;
      }
      .modal h3 {
        font-size:1.1rem;
        font-weight:600;
      }
      .modal label {
        font-size:0.78rem;
        color:var(--muted);
        display:block;
        margin-bottom:3px;
      }
      .modal input, .modal textarea, .modal select {
        width:100%;
        background:var(--inp);
        border:1px solid var(--border);
        border-radius:4px;
        padding:7px 10px;
        color:var(--text);
        font-family:'Inter',sans-serif;
        font-size:0.9rem;
        outline:none;
      }
      .modal input:focus, .modal textarea:focus, .modal select:focus {
        border-color:var(--accent);
      }
      .modal textarea {
        resize:vertical;
        min-height:70px;
      }
      .modal-actions {
        display:flex;
        gap:8px;
        justify-content:flex-end;
      }
      .modal-pre {
        background:var(--bg);
        border:1px solid var(--border);
        border-radius:4px;
        padding:10px;
        font-size:0.83rem;
        color:var(--muted);
        white-space:pre-wrap;
        word-break:break-word;
        max-height:220px;
        overflow-y:auto;
        font-family:'Inter',sans-serif;
        line-height:1.6;
      }
      .modal-note {
        font-size:0.78rem;
        color:var(--muted);
      }

      .toast {
        position:fixed;
        bottom:24px;
        right:24px;
        background:var(--bg3);
        border:1px solid var(--border);
        border-radius:6px;
        padding:12px 18px;
        font-size:0.88rem;
        color:var(--text);
        z-index:2000;
        opacity:0;
        transform:translateY(10px);
        transition:all .25s;
        pointer-events:none;
      }
      .toast.show {
        opacity:1;
        transform:translateY(0);
      }

      .notif-badge {
        background:var(--accent2);
        color:#fff;
        border-radius:50%;
        font-size:0.7rem;
        padding:1px 5px;
        margin-left:4px;
        vertical-align:middle;
        display:none;
      }
      .notif-badge.visible {
        display:inline;
      }

      #cart-screen {
        background:var(--bg);
      }
      .cart-header {
        background:var(--bg2);
        padding:14px 24px;
        display:flex;
        align-items:center;
        gap:14px;
        border-bottom:1px solid var(--border);
        flex-shrink:0;
      }
      .cart-body {
        flex:1;
        overflow-y:auto;
        padding:28px 32px;
        display:flex;
        flex-direction:column;
        gap:14px;
      }
      .cart-empty {
        color:var(--muted);
        text-align:center;
        margin-top:60px;
        font-size:1.05rem;
      }
      .cart-item {
        background:var(--card);
        border:1px solid var(--border);
        border-radius:6px;
        padding:14px 18px;
        display:flex;
        align-items:center;
        gap:16px;
      }
      .cart-item img {
        width:100px;
        height:47px;
        object-fit:cover;
        border-radius:4px;
        flex-shrink:0;
      }
      .cart-item-info {
        flex:1;
      }
      .cart-item-title {
        font-weight:600;
        font-size:0.95rem;
        margin-bottom:3px;
      }
      .cart-item-genre {
        color:var(--accent2);
        font-size:0.75rem;
      }
      .cart-item-remove {
        background:none;
        border:1px solid var(--border);
        border-radius:4px;
        color:var(--muted);
        cursor:pointer;
        padding:5px 10px;
        font-size:0.8rem;
        transition:all .15s;
      }
      .cart-item-remove:hover {
        border-color:#c0392b;
        color:#e74c3c;
      }
      .cart-footer {
        background:var(--bg2);
        border-top:1px solid var(--border);
        padding:14px 32px;
        display:flex;
        justify-content:flex-end;
        gap:10px;
        flex-shrink:0;
      }
      .cart-icon-btn {
        background:var(--bg3);
        border:1px solid var(--border);
        border-radius:4px;
        color:var(--text);
        cursor:pointer;
        padding:6px 12px;
        font-size:1.1rem;
        position:relative;
        transition:opacity .15s;
      }
      .cart-icon-btn:hover {
        opacity:.8;
      }
      .cart-count-badge {
        position:absolute;
        top:-5px;
        right:-6px;
        background:var(--accent);
        color:#fff;
        border-radius:50%;
        font-size:0.65rem;
        width:16px;
        height:16px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:700;
        pointer-events:none;
      }
      .cart-total-row {
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:14px 0 0;
        border-top:1px solid var(--border);
        margin-top:8px;
      }
      .cart-total-label {
        font-size:0.82rem;
        color:var(--muted);
      }
      .cart-total-value {
        font-family:'Rajdhani',sans-serif;
        font-size:1.6rem;
        font-weight:700;
      }

      .star-picker {
        display:flex;
        gap:6px;
        font-size:1.8rem;
        cursor:pointer;
        margin:4px 0 8px;
      }
      .star-picker .sp {
        color:#444;
        transition:color .1s;
        user-select:none;
      }
      .star-picker .sp.lit {
        color:#f1c40f;
      }
      .review-stars {
        color:#f1c40f;
        font-size:0.85rem;
        letter-spacing:1px;
      }
      .review-stars .dim {
        color:#444;
      }
      .reviews-section {
        display:flex;
        flex-direction:column;
        gap:8px;
      }
      .review-card {
        background:var(--bg);
        border:1px solid var(--border);
        border-radius:5px;
        padding:9px 12px;
      }
      .review-card-header {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:3px;
      }
      .review-card-user {
        font-size:0.8rem;
        font-weight:600;
        color:var(--accent);
      }
      .review-card-comment {
        font-size:0.82rem;
        color:var(--muted);
        line-height:1.5;
      }

      .media-slider-wrap {
        position:relative;
        background:#000;
        border-radius:0;
        overflow:hidden;
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
      }
      .media-slider {
        flex:1;
        display:flex;
        overflow-x:auto;
        scroll-snap-type:x mandatory;
        scroll-behavior:smooth;
        min-height:0;
      }

    // API helper object
    const API = {
        // fetch GET request
        async get(path) {
            const r = await fetch(path);
            return r.json();
        },
        // send POST request
        async post(path, data) {
            const r = await fetch(path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                  },
                body: new URLSearchParams(data)
            });
            return r.json();
        },
        // send PUT request
        async put(path, data) {
            const r = await fetch(path, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                  },
                body: new URLSearchParams(data)
            });
            return r.json();
        },
        // send DELETE request
        async delete(path, data) {
            const r = await fetch(path, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                  },
                body: new URLSearchParams(data || {})
            });
            return r.json();
        }
    };

        const username = document.getElementById('m-inp-user').value.trim();

        const { role } = await API.post('/api/auth/login', { username, password });

            await API.post('/api/session/start', { username, role });
            await syncSession();
            closeModal();
            openCatalog();

    const CORS_PROXY = "https://corsproxy.io/?url=";

    // genre alias map
    const GENRE_MAP = {
        'action':'Action','rpg':'RPG','role-playing':'RPG','sports':'Sports','racing':'Sports',
        'shooter':'Shooter','first-person':'Shooter','fps':'Shooter','tactical':'Shooter',

    // fetch our genres
    async function getOurGenres() {
        const { genres } = await API.get('/api/genres');
        return genres.map(g => g.toLowerCase());
    }

    // map steam genre
    function mapGenre(steamGenre, ourGenres) {
        const lower = steamGenre.toLowerCase();
        const exactMatch = ourGenres.find(g => g === lower);
        if (exactMatch) return steamGenre;
        for (const [key, val] of Object.entries(GENRE_MAP))
            if (lower.includes(key)) return val;
        return null;
    }

    // render game grid
    async function buildGameGrid() {
        const body = document.getElementById('catalog-body');
        const searchResults = document.getElementById('search-results');
        body.querySelectorAll('.genre-section').forEach(s => s.remove());
        searchResults.innerHTML = '';
        searchResults.classList.remove('active');

        const placeholderSection = document.createElement('div');
        placeholderSection.className = 'genre-section';
        placeholderSection.id = 'placeholder-section';
        const placeholderRow = document.createElement('div');
        placeholderRow.className = 'genre-row';
        GAMES_LIST.slice(0, 12).forEach(() => {
            const ph = document.createElement('div');
            ph.className = 'card-placeholder';
            ph.innerHTML = '<div class="ph-img"></div><div class="ph-info"><div class="ph-line"></div><div class="ph-line ph-short"></div></div>';
            placeholderRow.appendChild(ph);
        });
        placeholderSection.appendChild(placeholderRow);
        body.appendChild(placeholderSection);

        const [ourGenres, backendGames, steamResults] = await Promise.all([
            getOurGenres(),
            API.get('/api/games').catch(() => []),
            Promise.all(GAMES_LIST.map(id => fetchGameData(id).then(game => ({ id, game }))))
        ]);

        const safeBackend = Array.isArray(backendGames) ? backendGames : [];

        document.getElementById('placeholder-section')?.remove();

        const genreMap = {};

        steamResults.forEach(({ id, game }) => {
            if (!game) return;
            const mapped = new Set();
            (game.genres.length ? game.genres : ['Other']).forEach(g => {
                const m = mapGenre(g, ourGenres);
                if (m) mapped.add(m);
            });
            if (mapped.size === 0) mapped.add('Other');
            mapped.forEach(genre => {
                if (!genreMap[genre]) genreMap[genre] = [];
                genreMap[genre].push({ type: 'steam', id, game, genres: [...mapped] });
            });
        });

        safeBackend.forEach(game => {
            const genre = game.genre || 'Other';
            if (!genreMap[genre]) genreMap[genre] = [];
            genreMap[genre].push({ type: 'dummy', game });
        });

        Object.keys(genreMap).sort().forEach(genre => {
            const section = document.createElement('div');
            section.className = 'genre-section';
            section.dataset.genre = genre.toLowerCase();
            const heading = document.createElement('div');
            heading.className = 'genre-heading';
            heading.textContent = genre;
            const row = document.createElement('div');
            row.className = 'genre-row';

            genreMap[genre].forEach(item => {
                let card;
                if (item.type === 'steam') {
                    card = buildCard(item.id, item.game, localRatingCache[item.id] || 0);
                    card.dataset.genres = item.genres.join(',').toLowerCase();
                } else {
                    card = buildDummyCard(item.game);
                    card.dataset.genres = (item.game.genre || '').toLowerCase();
                }
                row.appendChild(card);
            });

            section.appendChild(heading);
            section.appendChild(row);
            body.appendChild(section);
        });

        steamResults.forEach(({ id, game }) => {
            if (!game) return;
            const mapped = new Set();
            (game.genres.length ? game.genres : ['Other']).forEach(g => {
                const m = mapGenre(g, ourGenres);
                if (m) mapped.add(m);
            });
            const card = buildCard(id, game, localRatingCache[id] || 0);
            card.dataset.genres = [...mapped].join(',').toLowerCase();
            searchResults.appendChild(card);
        });
        safeBackend.forEach(game => {
            const card = buildDummyCard(game);
            card.dataset.genres = (game.genre || '').toLowerCase();
            searchResults.appendChild(card);
        });
    }

    // fetch steam data
    async function fetchGameData(appID) {
        if (gameCache[appID]) return gameCache[appID];
        try {
            const res = await fetch(`${CORS_PROXY}https://store.steampowered.com/api/appdetails?appids=${appID}`);
            const json = await res.json();
            const data = json[String(appID)]?.data;
            if (!data) return null;
            const p = data.platforms || {};
            const platform = p.windows ? 'Windows' : p.mac ? 'Mac' : p.linux ? 'Linux' : 'WEB';
            const game = {
                name: data.name,
                description: data.short_description,
                imageURL: data.header_image,
                platform,
                genres: (data.genres || []).map(g => g.description).slice(0, 3),
                movies: data.movies || [],
                screenshots: data.screenshots || []
            };
            gameCache[appID] = game;
            return game;
        } catch { return null; }
    }

    // build steam card
    function buildCard(appID, game, avgRating) {
        const rating = avgRating || 0;
        const rounded = Math.round(rating);
        let stars = '';
        for (let i = 1; i <= 5; i++) stars += `<span class="${i <= rounded ? '' : 'dim'}">★</span>`;
        const ratingLabel = rating > 0 ? `${rating.toFixed(1)} / 5` : 'No reviews yet';

        const card = document.createElement('div');
        card.className = 'game-card';
        card.dataset.appId = appID;
        card.dataset.name = game.name.toLowerCase();
        card.dataset.desc = (game.description || '').toLowerCase();
        card.innerHTML = `
            <img src="${game.imageURL}" alt="${escHtml(game.name)}" loading="lazy"/>
            <div class="card-info">
                <div class="card-title-row">
                    <span class="card-title">${escHtml(game.name)}</span>
                    <span class="platform-tag">${escHtml(game.platform)}</span>
                </div>
                <div class="card-tags">${game.genres.map(g => '#' + g).join('  ')}</div>
                <div class="card-desc">${escHtml(game.description)}</div>
                <div class="card-rating">
                    <span class="card-stars">${stars}</span>
                    <span class="card-rating-label">${ratingLabel}</span>
                </div>
            </div>`;
        card.addEventListener('click', () => openGame(appID, game.name));
        return card;
    }

    // build admin card
    function buildDummyCard(game) {
        const rating = localRatingCache[game.id] || game.averageRating || 0;
        const rounded = Math.round(rating);
        let stars = '';
        for (let i = 1; i <= 5; i++) stars += `<span class="${i <= rounded ? '' : 'dim'}">★</span>`;
        const ratingLabel = rating > 0 ? `${rating.toFixed(1)} / 5` : 'No reviews yet';

        const card = document.createElement('div');
        card.className = 'game-card';
        card.dataset.appId = 'dummy_' + game.id;
        card.dataset.name = (game.title || '').toLowerCase();
        card.dataset.desc = (game.description || '').toLowerCase();
        card.dataset.genres = (game.genre || '').toLowerCase();
        card.innerHTML = `
            <div class="dummy-img"><span>${escHtml(game.title)}</span></div>
            <div class="card-info">
                <div class="card-title-row">
                    <span class="card-title">${escHtml(game.title)}</span>
                    <span class="platform-tag">${escHtml(game.platform || 'PC')}</span>
                </div>
                <div class="card-tags">#${escHtml(game.genre || '')}</div>
                <div class="card-desc">${escHtml(game.description || 'An admin-added title.')}</div>
                <div class="card-rating">

                    <span class="card-rating-label">${ratingLabel}</span>

        return card;
    }

    // filter by search
    function filterCatalog() {
        const text = document.getElementById('search-bar').value.toLowerCase().trim();
        const genre = (document.getElementById('genre-filter').value || '').toLowerCase();
        const body = document.getElementById('catalog-body');
        const sr = document.getElementById('search-results');

        if (!text && !genre) {
            // Reset: show all genre sections
            sr.classList.remove('active');
            body.querySelectorAll('.genre-section').forEach(s => s.style.display = 'block');
            return;
        }

        if (!text && genre) {
            sr.classList.remove('active');
            body.querySelectorAll('.genre-section').forEach(s => {
                s.style.display = s.dataset.genre === genre ? 'block' : 'none';
            });
            return;
        }

        body.querySelectorAll('.genre-section').forEach(s => s.style.display = 'none');
        sr.classList.add('active');
        sr.querySelectorAll('.game-card').forEach(card => {
            const matchText = card.dataset.name.includes(text) || card.dataset.desc.includes(text);
            const matchGenre = !genre || (card.dataset.genres || '').includes(genre);
            card.style.display = matchText && matchGenre ? '' : 'none';
        });
    }

    // build reviews HTML
    async function buildReviewsHtml(appID) {
        const { result } = await API.get(`/api/reviews?gameId=${appID}`);
        if (result === 'No reviews yet.') {
            localRatingCache[appID] = 0; // ensure cache reflects "no reviews"
            return '<div style="color:var(--muted);font-size:0.82rem;">No reviews yet.</div>';
        }

        const items = result.split('\n').filter(Boolean).map(line => {
            const u = line.match(/User: ([^|]+)/);
            const r = line.match(/Rating: (\d+)/);
            const c = line.match(/Comment: (.*)/);
            return {
                user: u ? u[1].trim() : '?',
                rating: r ? parseInt(r[1]) : 0,
                comment: c ? c[1].trim() : ''
            };
        });

        const avg = items.length ? items.reduce((s, r) => s + r.rating, 0) / items.length : 0;
        const rounded = Math.round(avg);

        localRatingCache[appID] = avg;
        _updateCatalogCardRating(appID, avg);

        let avgStars = '';
        for (let i = 1; i <= 5; i++) avgStars += `<span class="${i <= rounded ? '' : 'dim'}">★</span>`;
        const summaryHtml = `
            <div style="display:flex;
            align-items:center;
            gap:10px;
            padding:8px 0 4px;
            border-bottom:1px solid var(--border);
            margin-bottom:6px;
            ">
                <span class="review-stars" style="font-size:1rem;
                ">${avgStars}</span>
                <span style="font-size:0.85rem;font-weight:600;
                ">${avg.toFixed(1)} / 5</span>
                <span style="font-size:0.75rem;
                color:var(--muted);
                ">(${items.length} review${items.length !== 1 ? 's' : ''})</span>
            </div>`;

        return summaryHtml + '<div class="reviews-section">' + items.map(r => `
            <div class="review-card">
                <div class="review-card-header">
                    <span class="review-card-user">${escHtml(r.user)}</span>
                    ${starsHtml(r.rating)}
                </div>
                <div class="review-card-comment">${escHtml(r.comment)}</div>
            </div>`).join('') + '</div>';
    }

    // update card rating
    function _updateCatalogCardRating(appID, avg) {
        const key = String(appID).startsWith('dummy') ? 'dummy_' + appID : String(appID);
        const cards = document.querySelectorAll(`.game-card[data-app-id="${key}"], .game-card[data-app-id="${appID}"]`);
        const rounded = Math.round(avg);
        let stars = '';
        for (let i = 1; i <= 5; i++) stars += `<span class="${i <= rounded ? '' : 'dim'}">★</span>`;
        const label = avg > 0 ? `${avg.toFixed(1)} / 5` : 'No reviews yet';
        cards.forEach(card => {
            const starsEl = card.querySelector('.card-stars');
            const labelEl = card.querySelector('.card-rating-label');
            if (starsEl) starsEl.innerHTML = stars;
            if (labelEl) labelEl.textContent = label;
        });
    }

    // build media slider
    function buildMediaSlider(game) {
        const slides = [];
        if (game.movies && game.movies.length > 0) {
            const movie = game.movies[0];
            const hlsUrl = movie.hls_h264 || null;
            let directUrl = null;
            if (!hlsUrl) {
                if (movie.mp4) directUrl = (typeof movie.mp4 === 'string') ? movie.mp4 : (movie.mp4['max'] || movie.mp4['480'] || null);
                if (!directUrl && movie.webm) directUrl = (typeof movie.webm === 'string') ? movie.webm : (movie.webm['max'] || movie.webm['480'] || null);
                if (!directUrl && movie.url) directUrl = movie.url;
            }
            if (hlsUrl) slides.push('<div class="media-slide"><video id="game-trailer" controls muted playsinline preload="auto"></video></div>');
            else if (directUrl) slides.push(`<div class="media-slide"><video id="game-trailer" controls autoplay muted playsinline preload="auto" src="${directUrl}"></video></div>`);
        }
        if (game.screenshots) {
            for (let i = 0; i < Math.min(8, game.screenshots.length); i++) {
                const sc = game.screenshots[i];
                if (sc?.path_full) slides.push(`<div class="media-slide"><img src="${sc.path_full}" loading="lazy"/></div>`);
            }
        }
        if (!slides.length) return '<div style="color:gray;padding:40px;text-align:center;">No media available</div>';
        let dots = '';
        slides.forEach((_, i) => dots += `<div class="slider-dot${i === 0 ? ' active' : ''}" onclick="sliderGo(${i})"></div>`);
        return `<div class="media-slider-wrap">
            <button class="slider-btn prev" onclick="sliderPrev()">&#8249;</button>
            <div class="media-slider" id="media-slider">${slides.join('')}</div>
            <button class="slider-btn next" onclick="sliderNext()">&#8250;</button>
            <div class="slider-dots" id="slider-dots">${dots}</div>
        </div>`;
    }

    // update dot indicators
    function updateDots() {
        document.querySelectorAll('#slider-dots .slider-dot').forEach((d, i) => d.classList.toggle('active', i === _sliderIndex));
    }
    // go to slide index
    function sliderGo(i) {
        const slider = document.getElementById('media-slider');
        if (!slider) return;
        _sliderIndex = Math.max(0, Math.min(i, slider.children.length - 1));
        slider.scrollTo({ left: _sliderIndex * slider.clientWidth, behavior: 'smooth' });
        updateDots();
    }
    // go to prev slide
    function sliderPrev() { sliderGo(_sliderIndex - 1); }
    // go to next slide
    function sliderNext() { sliderGo(_sliderIndex + 1); }

    // attach HLS trailer
    function attachTrailer(hlsUrl) {
        const vid = document.getElementById('game-trailer');
        if (!vid || !hlsUrl) return;
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(hlsUrl);
            hls.attachMedia(vid);
            hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
        } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
            vid.src = hlsUrl;
            vid.play().catch(() => {});
        }
    }

    // toggle support popup
    function toggleSupportPopup(e) {
        e.stopPropagation();
        document.getElementById('support-popup').classList.toggle('support-hidden');
    }
    document.addEventListener('click', () => {
        document.getElementById('support-popup')?.classList.add('support-hidden');
    });

    (async () => {
        await syncSession();
        openCatalog();
    })();
</script>
</body>
</html>
