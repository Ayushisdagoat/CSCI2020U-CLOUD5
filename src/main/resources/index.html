<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CLOUD5 Game Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
</head>
<body>

<div id="login-screen" class="screen active">
    <div class="login-logo">CLOUD5</div>
    <div class="login-box">
        <h2>Login</h2>
        <div><label>Username</label><input id="inp-user" type="text" autocomplete="off"/></div>
        <div><label>Password</label><input id="inp-pass" type="password"/></div>
        <div id="login-error">Invalid Username or Password</div>
        <button class="btn btn-primary" onclick="doLogin()">Login</button>
    </div>
</div>

<div id="catalog-screen" class="screen">
    <div class="header">
        <div class="header-logo">CLOUD5</div>
        <input type="text" id="search-bar" placeholder="Search games…" oninput="filterCatalog()"/>
        <div class="header-right" id="header-right"></div>
    </div>
    <div class="catalog-body" id="catalog-body">
        <div class="search-results" id="search-results"></div>
    </div>
</div>

<div id="game-screen" class="screen">
    <div class="game-title-bar" id="game-title-bar"></div>
    <div class="game-body">
        <div class="game-left" id="game-left">Loading…</div>
        <div class="game-right" id="game-right"></div>
    </div>
    <div class="game-footer" id="game-footer"></div>
</div>

<div id="cart-screen" class="screen">
    <div class="cart-header">
        <div class="header-logo">CLOUD5</div>
        <span style="color:var(--muted);font-size:0.9rem;">My Cart</span>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-footer" style="flex-direction:column;gap:12px;align-items:stretch;">
        <div id="cart-total-row" class="cart-total-row" style="display:none;">
            <span class="cart-total-label">Estimated Total</span>
            <span class="cart-total-value" id="cart-total-value">$0.00</span>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn btn-ghost" onclick="openCatalog()">← Continue Shopping</button>
            <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
            <button class="btn btn-buy" id="cart-buy-btn" style="display:none;" onclick="showToast('Purchased')">Buy Now</button>
        </div>
    </div>
</div>

<div id="profile-screen" class="screen">
    <div class="profile-header">
        <div class="header-logo">CLOUD5</div>
        <span style="color:var(--muted);font-size:0.9rem;">Profile</span>
    </div>
    <div class="profile-body" id="profile-body"></div>
    <div class="profile-footer">
        <button class="btn btn-ghost" onclick="openCatalog()">← Back to Store</button>
    </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const style = document.createElement('style');
        style.textContent = `
          :root {
            --bg:      #191919;
            --bg2:     #121212;
            --bg3:     #232323;
            --card:    #232323;
            --border:  #2e2e2e;
            --text:    #f0f0f0;
            --muted:   #999;
            --accent:  #4682B4;
            --accent2: #ff7878;
            --inp:     #3c3c3c;
          }
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
          .screen {
            display: none;
          }
          .screen.active {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
          }
          #login-screen {
            align-items: center;
            justify-content:
            center;
          }
          .login-logo {
            font-family: 'Arial', sans-serif;
            font-size: 3.5rem; font-weight: 700;
            letter-spacing: 4px; color: #fff;
            margin-bottom: 2rem; text-align: center;
          }
          .login-box {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 2rem;
            width: 340px; display: flex;
            flex-direction: column; gap: 1rem;
          }
          .login-box h2 {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
          }
          .login-box label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 2px;
            display: block;
          }
          .login-box input {
            width: 100%; background: var(--inp);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
          }
          .login-box input:focus {
            border-color: var(--accent);
          }
          #login-error {
            color: var(--accent2);
            font-size: 0.82rem;
            text-align: center;
            display: none;
          }
          .btn {
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem; font-weight: 500;
            transition: opacity .15s;
          }
          .btn:hover {
            opacity: .85;
          }
          .btn:disabled {
            opacity: .45;
            cursor: default;
          }
          .btn-primary {
            background: var(--accent);
            color: #fff;
          }
          .btn-danger {
            background: #c0392b;
            color: #fff;
          }
          .btn-ghost {
            background: var(--bg3);
            color: var(--text); border: 1px solid var(--border);
          }
          .header {
            background: var(--bg2);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
          }
          .header-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            white-space: nowrap;
          }
          .header input[type=text] {
            flex: 1;
            max-width: 500px;
            background: var(--inp);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
          }
          .header input[type=text]:focus {
            border-color: var(--accent);
          }
          .header-right {
            display: flex;
            gap: 8px;
            margin-left: auto;
          }
          #catalog-screen {
            background: var(--bg);
          }
          .catalog-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 36px;
          }
          .genre-section {
            display: block;
          }
          .genre-heading {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text);
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
          }
          .genre-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
          }
          .genre-row::-webkit-scrollbar {
            height: 4px;
          }
          .genre-row::-webkit-scrollbar-track {
            background: var(--bg2);
          }
          .genre-row::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
          }
          .game-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .15s, border-color .15s;
            flex-shrink: 0;
            width: 240px;
          }
          .game-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
          }
          .game-card img {
            width: 100%;
            display: block;
            height: 112px;
            object-fit: cover;
          }
          .card-info {
            padding: 9px 11px 11px;
          }
          .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 6px;
          }
          .card-title {
            font-weight: 600;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .platform-tag {
            background: var(--bg);
            color: var(--muted);
            font-size: 0.66rem;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
          }
          .card-tags {
            color: var(--accent2);
            font-size: 0.72rem;
            margin-bottom: 5px;
          }
          .card-desc {
            color: var(--muted);
            font-size: 0.75rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }
          .search-results {
            display: none;
            grid-template-columns: repeat(4,1fr);
            gap: 16px;
          }
          .search-results.active {
            display: grid;
          }
          .search-results .game-card {
            width: auto;
          }
          .search-results .game-card img {
            height: 130px;
          }
          @media(max-width:1100px){
            .search-results {
                grid-template-columns:repeat(3,1fr);
              }
            }
          .card-placeholder {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            animation: pulse 1.4s infinite;
            flex-shrink: 0;
            width: 240px;
          }
          .card-placeholder .ph-img {
            width: 100%;
            height: 112px;
            background: #2a2a2a;
          }
          .card-placeholder .ph-info {
            padding: 9px 11px 13px;
            display: flex;
            flex-direction: column;
            gap: 7px;
          }
          .card-placeholder .ph-line {
            height: 11px;
            border-radius: 3px;
            background: #2e2e2e;
          }
          .ph-short {
            width: 55%;
          }
          @keyframes pulse {
            0%,100%{opacity:1} 50%{opacity:.5}
          }
          .footer-bar {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
          }
          #game-screen {
            background: var(--bg);
          }
          .game-title-bar {
            padding: 20px 30px 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
          }
          .game-body {
            display: flex;
            gap: 24px;
            padding: 20px 30px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
          }
          .game-left {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            color: var(--muted);
            overflow: hidden;
            min-height: 0;
          }
          .game-left video {
            width: 100%;
            display: block;
          }
          .game-right {
            width: 380px;
            flex-shrink: 0;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            display: flex;
            flex-direction: column; gap: 10px;
            overflow-y: auto;
          }
          .game-right img {
            width: 100%;
            border-radius: 4px;
          }
          .game-right-desc {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.5;
          }
          .game-right-tags {
            color: var(--accent2);
            font-size: 0.82rem;
            font-weight: 600;
          }
          .game-footer {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
          }
          .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
          }
          .modal-overlay.hidden {
            display: none;
          }
          .modal {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            min-width: 320px;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 90vh;
            overflow-y: auto;
          }
          .modal h3 {
            font-size: 1.1rem;
            font-weight: 600;
          }
          .modal label {
            font-size: 0.78rem;
            color: var(--muted);
            display: block;
            margin-bottom: 3px;
          }
          .modal input, .modal textarea {
            width: 100%;
            background: var(--inp);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 7px 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
          }
          .modal input:focus, .modal textarea:focus {
            border-color: var(--accent);
          }
          .modal textarea {
            resize: vertical;
            min-height: 70px;
          }
          .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
          }
          .modal-pre {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.83rem;
            color: var(--muted);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 220px;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
          }
          .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 0.88rem;
            color: var(--text);
            z-index: 2000;
            opacity: 0;
            transform: translateY(10px);
            transition: all .25s;
            pointer-events: none;
          }
          .toast.show {
            opacity: 1;
            transform: translateY(0);
          }
          .notif-badge {
            background: var(--accent2);
            color: #fff;
            border-radius: 50%;
            font-size: 0.7rem;
            padding: 1px 5px;
            margin-left: 4px;
            vertical-align: middle;
            display: none;
          }
          .notif-badge.visible {
            display: inline;
          }
          .star-rating {
            display: flex;
            gap: 5px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #444;
            margin: 10px 0;
          }
          .star-rating .star.active {
            color: #f1c40f;
          }
          .star-rating .star:hover {
            color: #f39c12;
          }

          #cart-screen {
            background: var(--bg);
            }
          .cart-header {
            background: var(--bg2);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
          }
          .cart-header .header-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
          }
          .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          }
          .cart-empty {
            color: var(--muted);
            text-align: center;
            margin-top: 60px;
            font-size: 1.05rem;
          }
          .cart-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
          }
          .cart-item img {
            width: 100px;
            height: 47px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
          }
          .cart-item-info {
            flex: 1;
          }
          .cart-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 3px;
          }
          .cart-item-genre {
            color: var(--accent2);
            font-size: 0.75rem;
          }
          .cart-item-remove {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 0.8rem;
            transition: all .15s;
          }
          .cart-item-remove:hover {
            border-color: #c0392b;
            color: #e74c3c;
          }
          .cart-footer {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
          }
          .cart-icon-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            padding: 6px 12px;
            font-size: 1.1rem;
            position: relative;
            transition: opacity .15s;
          }
          .cart-icon-btn:hover {
            opacity: .8;
          }
          .cart-count-badge {
            position: absolute;
            top: -5px;
            right: -6px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            font-size: 0.65rem;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            pointer-events: none;
          }
          .star-picker { display: flex; gap: 6px; font-size: 1.8rem; cursor: pointer; margin: 4px 0 8px; }
          .star-picker .sp { color: #444; transition: color .1s; user-select: none; }
          .star-picker .sp.lit { color: #f1c40f; }
          .review-stars { color: #f1c40f; font-size: 0.85rem; letter-spacing: 1px; }
          .review-stars .dim { color: #444; }
          .reviews-section { display: flex; flex-direction: column; gap: 8px; }
          .review-card { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 9px 12px; }
          .review-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
          .review-card-user { font-size: 0.8rem; font-weight: 600; color: var(--accent); }
          .review-card-comment { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
          .media-slider-wrap {
            position: relative;
            background: #000;
            border-radius: 0;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
          }
          .media-slider {
            flex: 1;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            min-height: 0;
          }
          .media-slider::-webkit-scrollbar { display: none; }
          .media-slide {
            min-width: 100%;
            flex-shrink: 0;
            scroll-snap-align: start;
            display: flex;
          }
          .media-slide video,
          .media-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
          }
          .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.6); border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 8px 14px; z-index: 10; border-radius: 3px; transition: background .15s; }
          .slider-btn:hover { background: rgba(70,130,180,.8); }
          .slider-btn.prev { left: 6px; }
          .slider-btn.next { right: 6px; }
          .slider-dots { display: flex; justify-content: center; gap: 6px; padding: 6px 0; background: #000; }
          .slider-dot { width: 7px; height: 7px; border-radius: 50%; background: #444; cursor: pointer; transition: background .15s; }
          .slider-dot.active { background: var(--accent); }

          .profile-header { background: var(--bg2); padding: 14px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
          .profile-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px; }
          .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: #fff; font-weight: 700; flex-shrink: 0; }
          .profile-username { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; }
          .profile-role { font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; }
          .profile-footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 14px 32px; display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }

          .profile-icon-wrap { position: relative; }
          .profile-icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: 2px solid transparent; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, opacity .15s; font-family: 'Inter', sans-serif; }
          .profile-icon-btn:hover { border-color: #fff; opacity: .9; }
          .profile-dropdown { position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; min-width: 160px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,.5); overflow: hidden; display: none; }
          .profile-dropdown.open { display: block; }
          .profile-dropdown-user { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
          .profile-dropdown-user .pd-name { font-weight: 600; font-size: 0.9rem; }
          .profile-dropdown-user .pd-role { font-size: 0.74rem; color: var(--muted); margin-top: 1px; }
          .profile-dropdown a, .profile-dropdown button.pd-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 0.86rem; color: var(--text); background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-family: 'Inter', sans-serif; transition: background .12s; }
          .profile-dropdown a:hover, .profile-dropdown button.pd-item:hover { background: var(--bg); }

        addNotification(message) {

          messages.push(message);
          isRead.push(false);
        },
        getUnreadNotifications() {
          const lines = [];
          for (let i=0;i<notificationIds.length;i++)
            if (!isRead[i]) lines.push(`[${notificationIds[i]}] ${messages[i]}`);
          return lines.length ? lines.join("\n") : "No new notifications.";
        },
        getAllNotifications() {
          if (!notificationIds.length) return "No notifications.";
          return notificationIds.map((id,i) =>
            `[${id}] ${isRead[i]?'[READ]  ':'[UNREAD]'} ${messages[i]}`
          ).join("\n");
        },

    const ReviewService = (() => {
      const reviewIds=[],gameIds=[],usernames=[],ratings=[],comments=[],approved=[];
      let nextReviewId = 1;
      function updateAvg(gameId) {
        let total=0, count=0;
        for(let i=0;i<reviewIds.length;i++) if(gameIds[i]===gameId&&approved[i]){total+=ratings[i];count++;}
        if(count>0) GameService.updateAverageRating(gameId, total/count);
      }
      return {
        submitReview(gameId, username, rating, comment, gameTitle) {
          if(rating<1||rating>5) return false;
          for(let i=0;i<reviewIds.length;i++) if(gameIds[i]===gameId&&usernames[i]===username) return false;
          reviewIds.push(nextReviewId++); gameIds.push(gameId); usernames.push(username);
          ratings.push(rating); comments.push(comment); approved.push(false);
          NotificationService.addNotification(`New review pending for: ${gameTitle} by ${username}`);
          return true;
        },
        getPendingReviews() {
          const lines=[];
          for(let i=0;i<reviewIds.length;i++)
            if(!approved[i]) lines.push(`Review ID: ${reviewIds[i]} | Game ID: ${gameIds[i]} | User: ${usernames[i]} | Rating: ${ratings[i]} | Comment: ${comments[i]}`);
          return lines.length ? lines.join("\n") : "No pending reviews.";
        },
        approveReview(reviewId) { const i=reviewIds.indexOf(reviewId); if(i===-1) return false; approved[i]=true; updateAvg(gameIds[i]); return true; },
        rejectReview(reviewId) {
          const i=reviewIds.indexOf(reviewId); if(i===-1) return false;
          [reviewIds,gameIds,usernames,ratings,comments,approved].forEach(a=>a.splice(i,1)); return true;
        },
        getApprovedReviews(gameId) {
          const lines=[];
          for(let i=0;i<reviewIds.length;i++)
            if(gameIds[i]===gameId&&approved[i]) lines.push(`User: ${usernames[i]} | Rating: ${ratings[i]} | Comment: ${comments[i]}`);
          return lines.length ? lines.join("\n") : "No reviews yet.";

        getApprovedReviewsData(gameId) {
          const items=[];
          for(let i=0;i<reviewIds.length;i++)

      'racing':        'Sports',
      'shooter':       'Shooter',

      'massively multiplayer': 'Multiplayer',
    };

    const ourGenres = GenreService.getGenreList().map(g => g.toLowerCase());

    function mapGenre(steamGenre) {
      const lower = steamGenre.toLowerCase();
      if (ourGenres.includes(lower)) return steamGenre;
      for (const [key, val] of Object.entries(GENRE_MAP)) {
        if (lower.includes(key)) return val;
      }
      return null;
    }

    const genreMap={};
    results.forEach(({ appID, game }) => {
        if (!game) return;
        const mapped = new Set();
        (game.genres.length ? game.genres : ['Other']).forEach(g => {
          const m = mapGenre(g);
          if (m) mapped.add(m);
        });
        if (mapped.size === 0) mapped.add('Other');
        mapped.forEach(genre => {
          if (!genreMap[genre]) genreMap[genre] = [];
          genreMap[genre].push({ appID, game });

    async function fetchGameData(appID) {
      if(gameCache[appID]) return gameCache[appID];
      try {
        const res=await fetch(`${CORS_PROXY}https://store.steampowered.com/api/appdetails?appids=${appID}`);
        const json=await res.json();
        const data=json[String(appID)]?.data; if(!data) return null;
        let platform="WEB";
        const p=data.platforms||{};
        if(p.windows) platform="Windows"; else if(p.mac) platform="Mac"; else if(p.linux) platform="Linux";
        const game={ name:data.name, description:data.short_description, imageURL:data.header_image, platform, genres:(data.genres||[]).map(g=>g.description).slice(0,3), movies:data.movies||[], screenshots:data.screenshots||[] };
        gameCache[appID]=game; return game;
      } catch { return null; }
    }

    function buildCard(appID, game) {
      const card=document.createElement('div'); card.className='game-card';
      card.dataset.name=game.name.toLowerCase(); card.dataset.desc=game.description.toLowerCase();
      card.innerHTML=`
        <img src="${game.imageURL}" alt="${escHtml(game.name)}" loading="lazy"/>
        <div class="card-info">
          <div class="card-title-row"><span class="card-title">${escHtml(game.name)}</span><span class="platform-tag">${game.platform}</span></div>
          <div class="card-tags">${game.genres.map(g=>'#'+g).join('  ')}</div>
          <div class="card-desc">${escHtml(game.description)}</div>
        </div>`;
      card.addEventListener('click',()=>openGame(appID,game.name));
      return card;
    }

      const items = WishlistService.getWishlistItems(currentUser);
      const total = items.reduce((sum, it) => sum + getItemPrice(it.id), 0);
      const totalRow = document.getElementById('cart-total-row');
      const totalVal = document.getElementById('cart-total-value');
      const buyBtn = document.getElementById('cart-buy-btn');
      if(items.length > 0) {
        if(totalRow) { totalRow.style.display='flex'; }
        if(totalVal) totalVal.textContent = '$' + total.toFixed(2);
        if(buyBtn) buyBtn.style.display='inline-flex';
      } else {
        if(totalRow) totalRow.style.display='none';
        if(buyBtn) buyBtn.style.display='none';
      }
    }

    function starsHtml(rating) {
      let s='';

    function buildReviewsHtml(appID) {
      const items=ReviewService.getApprovedReviewsData(appID);
      if(!items.length) return '<div style="color:var(--muted);font-size:0.82rem;">No reviews yet.</div>';
      return '<div class="reviews-section">'+items.map(r=>`
        <div class="review-card">
          <div class="review-card-header">
            <span class="review-card-user">${escHtml(r.user)}</span>
            ${starsHtml(r.rating)}

        </div>`).join('')+'</div>';
    }

    function attachTrailer(hlsUrl) {
      const vid = document.getElementById('game-trailer');
      if (!vid || !hlsUrl) return;
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(vid);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { vid.play().catch(()=>{}); });
        hls.on(Hls.Events.ERROR, (e, d) => console.error('[CLOUD5] HLS error', d));
      } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        vid.src = hlsUrl;
        vid.play().catch(()=>{});
      } else {
        console.warn('[CLOUD5] HLS not supported in this browser');
      }
    }

    function buildMediaSlider(game) {
  const slides = [];
  let hlsUrl = null;

  if (game.movies && game.movies.length > 0) {
    const movie = game.movies[0];
    if (movie.hls_h264)  hlsUrl = movie.hls_h264;

    let directUrl = null;
    if (!hlsUrl) {
      if (movie.mp4)  directUrl = (typeof movie.mp4  === 'string') ? movie.mp4  : movie.mp4['max']  || movie.mp4['480']  || null;
      if (!directUrl && movie.webm) directUrl = (typeof movie.webm === 'string') ? movie.webm : movie.webm['max'] || movie.webm['480'] || null;
      if (!directUrl && movie.url) directUrl = movie.url;
    }

    if (hlsUrl) {
      slides.push(
        '<div class="media-slide">' +
          '<video id="game-trailer" controls muted playsinline preload="auto"></video>' +
        '</div>'
      );
    } else if (directUrl) {
      slides.push(
        '<div class="media-slide">' +
          '<video id="game-trailer" controls autoplay muted playsinline preload="auto" src="' + directUrl + '"></video>' +
        '</div>'
      );
    }
  }

  if (game.screenshots && game.screenshots.length > 0) {
    for (let i = 0; i < Math.min(8, game.screenshots.length); i++) {
      const sc = game.screenshots[i];
      if (sc && sc.path_full) {
        slides.push(
          '<div class="media-slide">' +
            '<img src="' + sc.path_full + '" loading="lazy"/>' +
          '</div>'
        );
      }
    }
  }

  if (slides.length === 0) {
    return '<div style="color:gray;padding:40px;text-align:center;">No media available</div>';
  }

  let dots = '';
  for (let i = 0; i < slides.length; i++) {
    dots += '<div class="slider-dot' + (i === 0 ? ' active' : '') +
            '" onclick="sliderGo(' + i + ')"></div>';
  }

  return (
    '<div class="media-slider-wrap">' +
      '<button class="slider-btn prev" onclick="sliderPrev()">&#8249;</button>' +
      '<div class="media-slider" id="media-slider">' +
        slides.join('') +
      '</div>' +
      '<button class="slider-btn next" onclick="sliderNext()">&#8250;</button>' +
      '<div class="slider-dots" id="slider-dots">' + dots + '</div>' +
    '</div>'
  );
}

    let _sliderIndex=0;
    function updateDots() {
      document.querySelectorAll('#slider-dots .slider-dot')
        .forEach((dot, i) => {
          dot.classList.toggle('active', i === _sliderIndex);
        });
    }

function sliderGo(i) {
  const slider = document.getElementById('media-slider');
  if (!slider) return;

  const count = slider.children.length;
  _sliderIndex = Math.max(0, Math.min(i, count - 1));

  slider.scrollTo({
    left: _sliderIndex * slider.clientWidth,
    behavior: 'smooth'
  });

  updateDots();
}

function sliderPrev() {
  sliderGo(_sliderIndex - 1);
}

function sliderNext() {
  sliderGo(_sliderIndex + 1);
}

    async function openGame(appID, gameName) {
      showScreen('game-screen');
      document.getElementById('game-title-bar').textContent='…';
      document.getElementById('game-left').innerHTML='<span>Loading…</span>';
      document.getElementById('game-right').innerHTML='';
      document.getElementById('game-footer').innerHTML='';

      const game=await fetchGameData(appID);
      if(!game){ document.getElementById('game-title-bar').textContent='Failed to load.'; return; }

      document.getElementById('game-title-bar').textContent=game.name;
      _sliderIndex=0;
      window._currentGameAppID=appID;

      document.getElementById('game-left').innerHTML=buildMediaSlider(game);

      if (game.movies && game.movies.length > 0 && game.movies[0].hls_h264) {
        attachTrailer(game.movies[0].hls_h264);
      }

      const dummyPrices = [9.99,14.99,19.99,24.99,29.99,39.99,49.99,59.99];
      const dummyPrice = dummyPrices[appID % dummyPrices.length].toFixed(2);

      document.getElementById('game-right').innerHTML=`
        <img src="${game.imageURL}" alt="${escHtml(game.name)}"/>
        <div class="game-price-box">
          <div>
            <div class="game-price-label">Price</div>
            <div class="game-price-value">$${dummyPrice}</div>
          </div>
        </div>
        <div class="game-right-desc">${escHtml(game.description)}</div>
        <div class="game-right-tags">${game.genres.map(g=>'#'+g).join('   ')}</div>
        <div style="margin-top:6px;font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Reviews</div>
        <div id="reviews-container">${buildReviewsHtml(appID)}</div>`;

      const footer=document.getElementById('game-footer');
      const backBtn=document.createElement('button');
      backBtn.className='btn btn-ghost'; backBtn.textContent='Back'; backBtn.onclick=openCatalog;
      footer.appendChild(backBtn);

      if(!isAdmin){
        const cartBtn=document.createElement('button'); cartBtn.className='btn btn-primary';
        const already=WishlistService.isInWishlist(currentUser,appID);
        cartBtn.textContent=already?'In Cart':'Add to Cart';
        if(already) cartBtn.disabled=true;
        cartBtn.onclick=()=>{
          const ok=WishlistService.addToWishlist(currentUser,appID,gameName,game.imageURL,game.genres[0]||'');
          showToast(ok?`${gameName} added to cart!`:`${gameName} is already in your cart!`);
          cartBtn.textContent='In Cart'; cartBtn.disabled=true;
          updateCartBadge();
        };
        footer.appendChild(cartBtn);

        const reviewBtn=document.createElement('button'); reviewBtn.className='btn btn-ghost'; reviewBtn.textContent='Write Review';
        reviewBtn.onclick=()=>showReviewModal(appID, gameName);
        footer.appendChild(reviewBtn);
      }
    }

    function showReviewModal(gameId, gameTitle) {
      openModal(`
        <h3>Review: ${escHtml(gameTitle)}</h3>
        <label style="font-size:0.78rem;color:var(--muted);">Rating</label>
        <div class="star-picker" id="star-picker">
          <span class="sp" data-v="1">★</span>
          <span class="sp" data-v="2">★</span>
          <span class="sp" data-v="3">★</span>
          <span class="sp" data-v="4">★</span>
          <span class="sp" data-v="5">★</span>
        </div>
        <input type="hidden" id="rv-rating" value="0"/>
        <div><label>Comment</label><textarea id="rv-comment"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="doSubmitReview(${gameId}, '${gameTitle.replace(/'/g,"\\'")}')">Submit</button>
        </div>`);
      const stars=document.querySelectorAll('#star-picker .sp');
      stars.forEach(star=>{
        star.addEventListener('mouseenter',()=>{
          const v=+star.dataset.v;
          stars.forEach(s=>s.classList.toggle('lit',+s.dataset.v<=v));
        });
        star.addEventListener('click',()=>{
          document.getElementById('rv-rating').value=star.dataset.v;
          stars.forEach(s=>s.classList.toggle('lit',+s.dataset.v<=+star.dataset.v));
        });
      });
      document.getElementById('star-picker').addEventListener('mouseleave',()=>{
        const cur=+document.getElementById('rv-rating').value;
        stars.forEach(s=>s.classList.toggle('lit',+s.dataset.v<=cur));
      });
    }
    function doSubmitReview(gameId, gameTitle) {
      const rating=parseInt(document.getElementById('rv-rating').value);
      const comment=document.getElementById('rv-comment').value;
      const ok=ReviewService.submitReview(gameId, currentUser, rating, comment, gameTitle);
      closeModal();
      showToast(ok?'Review submitted! Waiting for admin approval.':'Failed — invalid rating or already reviewed.');
    }
